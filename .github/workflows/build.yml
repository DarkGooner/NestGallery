name: Build and Sign APK

on:
  push:
    branches: [ "main", "face", "NSFW" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The NudeNet models are Git LFS objects (see .gitattributes). Without them the APK would ship ~130-byte pointer
      # files. They are cached by content, so a build only downloads them (counting against the repo's LFS bandwidth)
      # when a model changes.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects
        run: git lfs pull

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests (face clustering + ONNX kNN, NSFW decoding + filters)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NestGallery-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish a GitHub Release with the APK attached
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NestGallery build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
